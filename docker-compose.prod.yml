name: cur10usx-prod

services:
  nginx:
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_uploads:/var/www/uploads:ro
    ports:
      - "80:80"
      - "443:443"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nextjs:
    build:
      context: ./cur10us
      dockerfile: Dockerfile
    image: cur10usx/nextjs:${TAG:-latest}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_WS_URL: wss://${DOMAIN:-localhost}/ws
      WS_SERVER_URL: ws://ws-server:3001
    volumes:
      - app_uploads:/app/public/uploads
      - app_logs:/app/logs
    secrets:
      - auth_secret
      - google_client_id
      - google_client_secret
      - resend_api_key
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ws-server:
    build:
      context: ./ws-server
      dockerfile: Dockerfile
    image: cur10usx/ws-server:${TAG:-latest}
    ports:
      - "3001:3001"
    environment:
      WS_PORT: 3001
      WS_HOST: 0.0.0.0
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  auth_secret:
    file: ./secrets/auth_secret.txt
  google_client_id:
    file: ./secrets/google_client_id.txt
  google_client_secret:
    file: ./secrets/google_client_secret.txt
  resend_api_key:
    file: ./secrets/resend_api_key.txt
