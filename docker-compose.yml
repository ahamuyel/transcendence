services:
  nginx:
    build:
      context: ./containers/nginx
    container_name: cur10us-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - app
      - ws-server
    networks:
      - transcendence

  db:
    build:
      context: ./containers/db
    container_name: cur10us-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cur10us}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cur10us_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cur10us}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence

  redis:
    build:
      context: ./containers/redis
    container_name: cur10us-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - transcendence

  app:
    build:
      context: .
      dockerfile: containers/app/Dockerfile
    container_name: cur10us-app
    volumes:
      - /app/node_modules
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cur10us}:${POSTGRES_PASSWORD:-cur10us_pass}@db:5432/${POSTGRES_DB:-cur10us}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-cur10us}:${POSTGRES_PASSWORD:-cur10us_pass}@db:5432/${POSTGRES_DB:-cur10us}?schema=public
      REDIS_URL: redis://redis:6379
      WS_SERVER_URL: ws://ws-server:3001
      AUTH_URL: https://${DOMAIN:-localhost}
      NEXTAUTH_URL: https://${DOMAIN:-localhost}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - transcendence

  ws-server:
    build:
      context: .
      dockerfile: containers/ws-server/Dockerfile
    container_name: cur10us-ws
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      WS_PORT: 3001
      APP_HOST: app
      APP_PORT: 3000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - transcendence

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  transcendence:
    driver: bridge
