name: cur10usx

services:
  nginx:
    image: nginx:alpine
    container_name: cur10usx-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - app_uploads:/var/www/uploads:ro
    depends_on:
      nextjs:
        condition: service_started
      ws-server:
        condition: service_started
    networks:
      - cur10usx-net
    restart: unless-stopped

  nextjs:
    build:
      context: ./cur10us
      dockerfile: Dockerfile.dev
    container_name: cur10usx-nextjs
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      WS_SERVER_URL: ws://ws-server:3001
    volumes:
      - ./cur10us:/app
      - /app/node_modules
      - /app/.next
      - app_uploads:/app/public/uploads
      - app_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cur10usx-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ws-server:
    build:
      context: ./ws-server
      dockerfile: Dockerfile.dev
    container_name: cur10usx-ws
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      WS_PORT: 3001
      WS_HOST: 0.0.0.0
    volumes:
      - ./ws-server:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cur10usx-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cur10usx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - cur10usx-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  cur10usx-net:
    name: cur10usx-network
    driver: bridge

volumes:
  redis_data:
    driver: local
  app_uploads:
    driver: local
  app_logs:
    driver: local
